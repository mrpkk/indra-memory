[project]
name = "indra-memory"
version = "0.1.0"
description = "Долговременная память агента: SQLite + FTS5 + версии + граф связей. Не деградирует на длине контекста, потому что в контекст попадает только выборка по релевантности"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
memory = "memory:main"

license = { text = "Apache-2.0" }
keywords = ["memory", "agents", "context", "knowledge-graph", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/mrpkk/attest"
Repository = "https://github.com/mrpkk/attest"
Issues = "https://github.com/mrpkk/attest/issues"
Sponsor = "https://github.com/sponsors/mrpkk"

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["memory"]
